# Fastly 2021: VCL config bug that took down 85% of internet traffic
# Simulated by: NetworkChaos corrupt packets on frontend → corrupted HTTP responses
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: hist-fastly-2021-frontend-corrupt
  namespace: chaos-mesh
  labels:
    scenario: hist-fastly-2021
    tier: named_replay
spec:
  action: corrupt
  mode: all
  selector:
    namespaces: [default]
    labelSelectors:
      app: frontend
  corrupt:
    corrupt: "60"
    correlation: "25"
  duration: "10m"
