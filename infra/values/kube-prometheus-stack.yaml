grafana:
  enabled: true
  service:
    type: LoadBalancer
  # Do not commit static admin passwords. Set via one of:
  # - grafana.admin.existingSecret
  # - helm --set-file for secure CI/CD injection
  # Grafana chart will generate a random admin password if none is provided.
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    additionalScrapeConfigs:
      - job_name: 'online-boutique'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

alertmanager:
  alertmanagerSpec:
    # Keep this name aligned with infra/setup.sh where the Secret is created.
    # A mismatch here makes Alertmanager start with the chart default config,
    # which silently bypasses the coordinator webhook route.
    configSecret: alertmanager-AtlasOps-config
  service:
    type: ClusterIP

# Disable components that require hostPID/hostPath or managed control-plane access.
# nodeExporter needs hostPath; kube{Proxy,Etcd,ControllerManager,Scheduler} target
# GKE-managed endpoints that are inaccessible on Standard clusters.
nodeExporter:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

coreDns:
  enabled: false

# Disable node affinity with disallowed label keys
prometheusOperator:
  enabled: true
  affinity: {}
  tolerations: []

kubeStateMetrics:
  enabled: true
