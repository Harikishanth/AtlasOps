server:
  service:
    type: LoadBalancer

# Keep secure defaults in versioned config. For demo-only environments,
# pass --set server.extraArgs[0]=--insecure at deploy time instead.

repoServer:
  replicaCount: 1

applicationSet:
  enabled: true

notifications:
  enabled: false  # we use Alertmanager + Slack instead

# Reduce resource requests for demo-sized cluster (3× e2-standard-4)
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
